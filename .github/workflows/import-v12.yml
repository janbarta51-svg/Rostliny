name: Import Atlas v1.2 bundle

on:
  push:
    branches: [main]
    paths:
      - '_import/atlas_v12.part*'

permissions:
  contents: write

concurrency:
  group: atlas-v12-import
  cancel-in-progress: false

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[atlas-v12-import]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild archive
        shell: bash
        run: |
          set -euo pipefail
          cat _import/atlas_v12.part* | tr -d '\n\r' | base64 -d > /tmp/atlas-v12.zip
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('/tmp/atlas-v12.zip')
          bad=z.testzip()
          if bad:
              raise SystemExit(f'Broken ZIP member: {bad}')
          print('ZIP OK:', len(z.infolist()), 'members')
          z.extractall('/tmp/atlas-v12')
          PY

      - name: Replace atlas with verified v1.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf content dist tools
          rm -f build.py
          cp -a /tmp/atlas-v12/content .
          cp -a /tmp/atlas-v12/dist .
          cp -a /tmp/atlas-v12/tools .
          cp /tmp/atlas-v12/.pages.yml .pages.yml
          cp /tmp/atlas-v12/.github/workflows/pages.yml .github/workflows/pages.yml
          cp /tmp/atlas-v12/README.md README.md
          cp /tmp/atlas-v12/PAGESCMS.md PAGESCMS.md
          rm -rf _import

      - name: Validate imported atlas
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python tools/build_from_cms.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('dist/data/plants.json').read_text(encoding='utf-8'))
          photos=sum(len(x.get('photos',[])) for x in p)
          thumbs=list(Path('dist/images/thumbs').glob('*.webp'))
          full=[x for x in Path('dist/images').glob('*.webp') if x.is_file()]
          assert len(p)==601, len(p)
          assert photos==1064, photos
          assert len(full)==1064, len(full)
          assert len(thumbs)==1064, len(thumbs)
          print('VALID:', len(p), 'plants,', photos, 'photos,', len(thumbs), 'thumbs')
          PY

      - name: Commit imported atlas in safe batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          : > /tmp/import-debug.txt
          echo "HEAD before import: $(git rev-parse HEAD)" >> /tmp/import-debug.txt
          echo "branch: $(git branch --show-current)" >> /tmp/import-debug.txt

          # Keep the verified extracted source safe, then reset the checkout and
          # publish structure/content first without the heavy image payload.
          rm -rf /tmp/atlas-v12-verified
          cp -a /tmp/atlas-v12 /tmp/atlas-v12-verified
          git reset --hard HEAD

          rm -rf content tools dist
          mkdir -p dist
          cp -a /tmp/atlas-v12-verified/content .
          cp -a /tmp/atlas-v12-verified/tools .
          cp /tmp/atlas-v12-verified/.pages.yml .pages.yml
          cp /tmp/atlas-v12-verified/README.md README.md
          cp /tmp/atlas-v12-verified/PAGESCMS.md PAGESCMS.md
          find /tmp/atlas-v12-verified/dist -mindepth 1 -maxdepth 1 ! -name images -exec cp -a {} dist/ \;

          git add -A ':!_import'
          echo '--- staged summary ---' >> /tmp/import-debug.txt
          git diff --cached --stat >> /tmp/import-debug.txt 2>&1 || true
          echo '--- commit ---' >> /tmp/import-debug.txt
          git commit -m '[atlas-v12-import] Install v1.2 data, PWA and PagesCMS' >> /tmp/import-debug.txt 2>&1
          echo '--- push ---' >> /tmp/import-debug.txt
          git push origin HEAD:main >> /tmp/import-debug.txt 2>&1

          mkdir -p dist/images
          mapfile -t MEDIA < <(find /tmp/atlas-v12-verified/dist/images -type f | sort)
          total=${#MEDIA[@]}
          batch=150
          n=0
          for ((i=0; i<total; i+=batch)); do
            end=$((i+batch)); (( end > total )) && end=$total
            for ((j=i; j<end; j++)); do
              src="${MEDIA[$j]}"
              rel="${src#/tmp/atlas-v12-verified/dist/images/}"
              mkdir -p "dist/images/$(dirname "$rel")"
              cp "$src" "dist/images/$rel"
            done
            git add dist/images
            n=$((n+1))
            git commit -m "[atlas-v12-import] Media batch $n ($((i+1))-$end of $total)"
            git push origin HEAD:main
          done

          rm -rf _import
          git add -A
          git commit -m '[atlas-v12-import] Finish v1.2 import cleanup'
          git push origin HEAD:main

      - name: Upload import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-import-debug
          path: /tmp/import-debug.txt
